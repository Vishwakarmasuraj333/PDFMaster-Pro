version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pdfmaster_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pdfmaster_pro
      MYSQL_USER: pdfmaster_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: pdfmaster_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pdfmaster_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=mysql://pdfmaster_user:userpassword@mysql:3306/pdfmaster_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_key_2026
    depends_on:
      - mysql
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pdfmaster_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  mysql_data:
